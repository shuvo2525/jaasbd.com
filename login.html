<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login | JAAS BD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 50%, #FAF5FF 100%);
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 40px -10px rgba(15, 23, 42, 0.1);
      text-align: center;
    }
    .brand-wrap {
      display: inline-block;
      text-decoration: none;
      margin-bottom: 20px;
    }
    .brand-wrap img { height: 62px; width: auto; display: block; margin: 0 auto; }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13.5px;
      color: #64748B;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #0077B6;
      box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.15);
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #0077B6 0%, #023E8A 100%);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      padding: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 119, 182, 0.35);
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: #023E8A;
      transform: translateY(-2px);
    }


    .extra-links {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #F1F5F9;
      font-size: 13px;
      color: #64748B;
      display: flex;
      justify-content: space-between;
    }
    .extra-links a {
      color: #0077B6;
      text-decoration: none;
      font-weight: 600;
    }
    .extra-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-card">
    <a href="index.html" class="brand-wrap">
      <img src="assets/images/jaasbd-logo.png" alt="JAAS BD">
    </a>

    <h2 class="login-title">Client Area Login</h2>
    <p class="login-sub">Access your hosting services, cPanel, billing, and domains.</p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username or Email Address</label>
        <input type="text" id="loginEmail" class="form-control" placeholder="Enter username or email" required autofocus>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">Log In &rarr;</button>
    </form>

    <div class="extra-links" style="justify-content: center;">
      <a href="index.html">&larr; Back to Main Website</a>
    </div>
  </div>

  <script src="assets/js/jaas-system.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const loginId = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value.trim();

      // Check admin credentials
      if ((loginId === 'admin' || loginId === 'admin@jaasbd.com') && password === 'admin123') {
        sessionStorage.setItem('jaas_admin_logged_in', 'true');
        sessionStorage.setItem('jaas_admin_user', 'admin');
        localStorage.setItem('jaas_admin_logged_in', 'true');
        localStorage.setItem('jaas_admin_user', 'admin');
        const user = JaasStore.getClientUser();
        user.email = 'admin@jaasbd.com';
        user.name = 'Administrator';
        user.loggedIn = true;
        JaasStore.setClientUser(user);
        window.location.href = 'clientarea.html';
        return;
      }

      // Check client login
      if (password === 'admin123' || password.length >= 4) {
        const user = JaasStore.getClientUser();
        user.email = loginId.includes('@') ? loginId : `${loginId}@jaasbd.com`;
        user.loggedIn = true;
        JaasStore.setClientUser(user);
        window.location.href = 'clientarea.html';
      } else {
        alert('Invalid password! Please try again.');
      }
    }
  </script>
</body>
</html>
